version: '3.8'
services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      RATELIMIT_STORAGE_URL: redis://redis:6379/0
    depends_on:
      - redis
  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "19006:19006"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
  redis:
    image: redis:7
    volumes:
      - redis-data:/data
volumes:
  redis-data:
